<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RL Cookbook</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{--ink:#1f2328;--ink2:#57606a;--ink3:#8c959f;--rule:#e6e8eb;--accent:#1f2328;
--serif:"Iowan Old Style","Iowan Old Style BT","Charis SIL",Charter,Georgia,serif;
--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:SFMono-Regular,"SF Mono",ui-monospace,Menlo,Consolas,monospace}
html[lang=zh]{--serif:"Iowan Old Style","Charis SIL",Charter,"Noto Serif SC","Songti SC",serif;
--sans:Inter,"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.75;
-webkit-font-smoothing:antialiased}
.body{font-family:var(--serif);font-size:17.5px;line-height:1.65;font-kerning:normal}
html[lang=zh] body{line-height:1.85}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--rule);display:flex;align-items:center;
justify-content:space-between;height:52px;padding:0 24px}
.top .mark{font-weight:650;font-size:15px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.top .mark i{width:14px;height:14px;border-radius:4px;background:#6d5efc;display:inline-block}
.top nav a{margin-left:22px;font-size:14px;color:var(--ink2);text-decoration:none}
.top nav a:hover{color:var(--ink)}
.top nav a.on{color:var(--ink);font-weight:600}
.page{max-width:828px;margin:0 auto;padding:0 24px 140px}
.toc{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:20;max-height:80vh;overflow:hidden auto;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45;transition:background .2s,box-shadow .2s}
.toc .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0;max-height:0;opacity:0;overflow:hidden;transition:opacity .2s,max-height .2s,margin .2s}
.toc a{display:flex;align-items:baseline;gap:10px;color:#3d444d;text-decoration:none;padding:4px 0}
.toc a::before{content:"";flex:none;align-self:center;width:14px;height:2px;border-radius:1px;background:#d3d7dc;transition:width .2s,background .2s}
.toc a.on::before{width:22px;background:var(--ink)}
.toc a span{display:block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:opacity .2s,max-width .25s}
.toc:hover{background:rgba(255,255,255,.97);box-shadow:0 6px 28px rgba(15,20,25,.10)}
.toc:hover .lbl{max-height:2em;opacity:1;margin:0 0 8px}
.toc:hover a span{max-width:clamp(170px,calc(50vw - 500px),250px);opacity:1;white-space:normal}
.toc a:hover{color:var(--ink)}
.toc a.on span{color:var(--ink);font-weight:600}
.body{min-width:0}
.head{padding:56px 0 8px;margin-bottom:36px;border-bottom:1px solid var(--rule)}
.head h1{font-size:34px;line-height:1.28;font-weight:600;margin:0 0 12px;text-wrap:balance}
.head .sub{font-size:19.5px;line-height:1.5;color:var(--ink2);font-style:italic;margin:0 0 18px}
html[lang=zh] .head .sub{font-style:normal}
html[lang=zh] .head h1{word-break:keep-all}
.head .meta{font-family:var(--sans);font-size:13.5px;color:var(--ink3);margin:0 0 6px}
.head .note{font-family:var(--sans);font-size:14px;line-height:1.6;color:var(--ink2);margin:0 0 22px}
.body p{margin:0 0 1.15em}
.body h2{font-size:26px;line-height:1.35;font-weight:600;margin:2.2em 0 .7em}
.body h3{font-size:20px;line-height:1.4;font-weight:600;font-style:normal;margin:2em 0 .5em}
.body b,.body strong{font-weight:600}
.body a{color:inherit;text-decoration:underline;text-decoration-color:rgba(31,35,40,.3);text-underline-offset:2px}
.body a:hover{text-decoration-color:rgba(31,35,40,.7)}
.body ul,.body ol{padding-left:1.3em;margin:0 0 1.15em}
.body li{margin:0 0 .35em}
.body code{font-family:var(--mono);font-size:.85em;background:#f3f4f6;border-radius:4px;padding:1px 4px}
.body hr{border:0;border-top:1px solid var(--rule);margin:44px 0}
.body figure{margin:40px 0 44px}
.body figure img{display:block;width:100%;height:auto}
.body figcaption{font-family:var(--sans);font-size:14px;line-height:1.55;color:var(--ink2);margin-top:12px}
.body figcaption b{color:var(--ink);font-weight:600}
.body figcaption .setup{display:block;margin-top:5px;font-size:13px;color:var(--ink3)}
.body .callout{border-left:3px solid var(--ink);padding:2px 0 2px 18px;margin:28px 0 32px}
.body .callout p{margin:0}
.body .callout ul{margin:8px 0 0;padding-left:1.2em}
.body .callout li{margin:0 0 .35em}
.body .callout li:last-child{margin-bottom:0}
.body a.figref{color:inherit;text-decoration:underline;text-decoration-color:#c7cdd4;text-underline-offset:2px}
.body figure,.body h2,.body h3{scroll-margin-top:24px}
.body a.secref{color:inherit;text-decoration:underline;text-decoration-color:#c7cdd4;text-underline-offset:2px}
.body .callout.finding{background:#fffbea;border-left:3px solid #f0c64a;border-radius:8px;padding:16px 22px}
.body table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:14px;line-height:1.5;margin:20px 0 32px}
.body th{font-size:12.5px;font-weight:600;color:var(--ink2);text-align:left;border-bottom:1px solid #d0d7de;padding:8px 10px 8px 0}
.body td{border-bottom:1px solid #eef0f2;padding:8px 10px 8px 0;vertical-align:top}
.body table.narrow{width:auto;min-width:50%;margin-left:auto;margin-right:auto}
.body table.narrow th,.body table.narrow td{padding:8px 20px}
.body details{margin:22px 0 26px}
.body summary{cursor:pointer;font-family:var(--sans);font-size:15px;line-height:1.5;font-weight:600;color:var(--ink2);list-style:none}
.body summary:hover{color:var(--ink)}
.body summary::-webkit-details-marker{display:none}
.body summary::before{content:"+";display:inline-block;width:1.1em;color:var(--ink3);font-weight:400}
.body details[open] summary::before{content:"\2212"}
.body details[open] summary{margin-bottom:12px}
.body details[open]{background:#f6f8fa;border-radius:8px;padding:14px 18px 6px}
.body a.cite{text-decoration:none;border-bottom:1px dotted rgba(31,35,40,.45)}
.body a.cite:hover{border-bottom-color:rgba(31,35,40,.85)}
.body .refs{font-size:15px;line-height:1.55;color:var(--ink2)}
.body .refs p{margin:0 0 .7em;padding-left:1.6em;text-indent:-1.6em}
.body .refs p:target{background:#fff8c5;box-shadow:-6px 0 0 #fff8c5,6px 0 0 #fff8c5}
.body .refs a{white-space:nowrap}
.katex{font-size:1.04em}
@media (max-width:760px){.toc{display:none}.page{padding:0 18px 100px}.head h1{font-size:28px}.top nav a{margin-left:14px}}
:root{--hover:#f3f4f6}
.top .theme{display:flex;align-items:center;justify-content:center;width:32px;height:32px;margin-left:16px;padding:0;border:0;border-radius:8px;background:none;color:var(--ink2);cursor:pointer}
.top .theme:hover{color:var(--ink);background:var(--hover)}
.top .theme .sun,html[data-theme=dark] .top .theme .moon{display:none}
html[data-theme=dark] .top .theme .sun{display:block}
html[data-theme=dark]{color-scheme:dark;--ink:#e6edf3;--ink2:#9da7b3;--ink3:#7d8590;--rule:#30363d;--accent:#e6edf3;--hover:#21262d}
html[data-theme=dark] body,html[data-theme=dark] .top{background:#0d1117}
html[data-theme=dark] .toc a{color:#adb5bd}
html[data-theme=dark] .toc a::before{background:#3d444d}
html[data-theme=dark] .toc:hover{background:rgba(22,27,34,.97);box-shadow:0 6px 28px rgba(0,0,0,.5)}
html[data-theme=dark] .body a{text-decoration-color:rgba(230,237,243,.3)}
html[data-theme=dark] .body a:hover{text-decoration-color:rgba(230,237,243,.7)}
html[data-theme=dark] .body a.figref,html[data-theme=dark] .body a.secref{text-decoration-color:#4d5560}
html[data-theme=dark] .body a.cite{border-bottom-color:rgba(230,237,243,.45)}
html[data-theme=dark] .body a.cite:hover{border-bottom-color:rgba(230,237,243,.85)}
html[data-theme=dark] .body code{background:#21262d}
html[data-theme=dark] .body details[open]{background:#161b22}
html[data-theme=dark] .body th{border-bottom-color:#3d444d}
html[data-theme=dark] .body td{border-bottom-color:#262c34}
html[data-theme=dark] .body .callout.finding{background:#2a2414;border-left-color:#b8902a}
html[data-theme=dark] .body .refs p:target{background:#3a3412;box-shadow:-6px 0 0 #3a3412,6px 0 0 #3a3412}
html[data-theme=dark] .body figure img{filter:invert(.92) hue-rotate(180deg)}
.posts{list-style:none;margin:56px 0 0;padding:0}
.posts li{padding:22px 0;border-bottom:1px solid var(--rule)}
.posts a{font-family:var(--serif);font-size:22px;line-height:1.35;font-weight:600;color:var(--ink);text-decoration:none}
.posts a:hover{text-decoration:underline;text-underline-offset:3px}
.posts .sub{font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--ink2);font-style:italic;margin:6px 0 8px}
.posts .meta{font-size:13.5px;color:var(--ink3);margin:0}
</style></head><body>

</body></html>
